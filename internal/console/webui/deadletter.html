<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>死信队列 - EdgeLog</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; color: #222; }
nav a { margin-right: 14px; }
table { border-collapse: collapse; width: 100%; margin-top: 16px; }
th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
</style>
</head>
<body>
<h1>EdgeLog 死信队列</h1>
<nav>
  <a href="/ui/pipelines">管道监控</a>
  <a href="/ui/config">采集配置</a>
  <a href="/ui/rules">路由规则</a>
  <a href="/ui/deadletter">死信队列</a>
</nav>
<table id="grid">
  <thead><tr><th>批次</th><th>主题</th><th>分区</th><th>原因</th><th>状态</th><th>操作</th></tr></thead>
  <tbody></tbody>
</table>
<script>
async function load() {
  const letters = await (await fetch('/api/deadletters')).json();
  const body = document.querySelector('#grid tbody');
  body.innerHTML = '';
  for (const l of letters) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${l.batch_id.slice(0, 8)}</td><td>${l.topic}</td><td>${l.partition}</td>
      <td>${l.reason}</td><td>${l.requeued ? '已重投' : '待处理'}</td>
      <td>${l.requeued ? '-' : `<button onclick="requeue('${l.id}')">重投</button>`}</td>`;
    body.appendChild(tr);
  }
}
async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) { alert(await res.text()); return null; }
  return res.json();
}
async function requeue(id) {
  await api(`/api/deadletters/${id}/requeue`, { method: 'POST' });
  load();
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
