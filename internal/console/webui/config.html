<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>采集配置 - EdgeLog</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; color: #222; }
nav a { margin-right: 14px; }
table { border-collapse: collapse; width: 100%; margin-top: 16px; }
th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
form { margin-top: 12px; }
input, button { margin-right: 8px; }
</style>
</head>
<body>
<h1>EdgeLog 采集配置</h1>
<nav>
  <a href="/ui/pipelines">管道监控</a>
  <a href="/ui/config">采集配置</a>
  <a href="/ui/rules">路由规则</a>
  <a href="/ui/deadletter">死信队列</a>
</nav>
<form id="source">
  <input id="name" placeholder="源名称" required>
  <button type="submit">注册源</button>
</form>
<form id="pipeline">
  <input id="sourceId" placeholder="源 ID" required>
  <input id="batchSize" placeholder="批次大小" value="100" required>
  <input id="sinkIds" placeholder="接收端 ID（逗号分隔）" required>
  <button type="submit">切换管道</button>
</form>
<table id="grid">
  <thead><tr><th>名称</th><th>文件</th><th>管道</th></tr></thead>
  <tbody></tbody>
</table>
<script>
async function load() {
  const data = await (await fetch('/api/status')).json();
  const rows = data.pipelines || [];
  const body = document.querySelector('#grid tbody');
  body.innerHTML = '';
  for (const row of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row.source.name}</td><td>${row.source.path}</td>
      <td>${row.active ? '批次 ' + row.pipeline.batch_size : '未启用'}</td>`;
    body.appendChild(tr);
  }
}
async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) { alert(await res.text()); return null; }
  return res.json();
}
document.querySelector('#source').addEventListener('submit', async (e) => {
  e.preventDefault();
  await api('/api/sources', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: document.querySelector('#name').value}) });
  load();
});
document.querySelector('#pipeline').addEventListener('submit', async (e) => {
  e.preventDefault();
  await api('/api/pipelines', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      source_id: document.querySelector('#sourceId').value,
      batch_size: +document.querySelector('#batchSize').value,
      sink_ids: document.querySelector('#sinkIds').value.split(',').map(x => x.trim()).filter(Boolean)
    }) });
  load();
});
load();
</script>
</body>
</html>
